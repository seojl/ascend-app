name: Build Ascend APK

on:
  push:
    branches: [ main ]
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Create a fresh Flutter project scaffold
        run: flutter create --platforms=android ascend_scaffold

      - name: Add internet permission to Android manifest
        run: |
          sed -i '/<manifest/a\    <uses-permission android:name="android.permission.INTERNET"/>' ascend_scaffold/android/app/src/main/AndroidManifest.xml
          cat ascend_scaffold/android/app/src/main/AndroidManifest.xml

      - name: Copy Ascend source into the scaffold
        run: |
          cp -r ascend_app/lib/* ascend_scaffold/lib/
          cp ascend_app/pubspec.yaml ascend_scaffold/pubspec.yaml

      - name: Get dependencies
        working-directory: ascend_scaffold
        run: flutter pub get

      - name: Build release APK
        working-directory: ascend_scaffold
        run: flutter build apk --release

      - name: Upload APK as build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ascend-apk
          path: ascend_scaffold/build/app/outputs/flutter-apk/app-release.apk
